<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Log del Bot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
  <style>
    pre {
      background: #111;
      color: #0f0;
      padding: 15px;
      border-radius: 8px;
      max-height: 70vh;
      overflow-y: auto;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container mt-4">
    <h2 class="text-center mb-4">Log del Sistema</h2>

    <ul class="nav nav-tabs mb-3" id="logTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="bot-tab" data-bs-toggle="tab" data-bs-target="#bot" type="button">
          Log Bot
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="paapi-tab" data-bs-toggle="tab" data-bs-target="#paapi" type="button">
          Log Paapi
        </button>
      </li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="bot">
        <pre>{{ bot_log }}</pre>
      </div>
      <div class="tab-pane fade" id="paapi">
        <pre>{{ paapi_log }}</pre>
      </div>
    </div>

    <div class="mt-3 text-center">
      <a href="{{ url_for('home') }}" class="btn btn-secondary">Torna alla Home</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
