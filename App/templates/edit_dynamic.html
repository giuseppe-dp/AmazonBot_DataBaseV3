<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Modifica dati dinamici</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='edit_dynamic.css') }}">
</head>
<body>
    <h2>Modifica dati dinamici per {{ product["asin"] }}</h2>

    <p class="note">Lascia un campo vuoto per mantenerne il valore corrente (non verrà modificato).</p>

    <form method="POST">
        <label for="image_url">Image URL</label>
        <input type="text" name="image_url" value="{{ product['image_url'] or '' }}" placeholder="https://...">

        <label for="price">Price</label>
        <input type="text" name="price" value="{{ product['price'] or '' }}" placeholder="es. 19.99 €">

        <label for="detail_page_url">Detail page URL</label>
        <input type="text" name="detail_page_url" value="{{ product['detail_page_url'] or '' }}" placeholder="https://www.amazon.it/dp/...">

        <label for="offering_id">Offering ID</label>
        <input type="text" name="offering_id" value="{{ product['offering_id'] or '' }}" placeholder="offering id">

        <button type="submit">💾 Salva modifiche</button>
    </form>

    <p style="text-align:center; margin-top:20px;">
        <a class="page" href="{{ url_for('dashboard') }}">⬅️ Torna alla lista</a>
        <a class="page" href="{{ url_for('show_product', asin=product['asin']) }}">🔎 Vai ai dettagli</a>
    </p>
</body>
</html>
