<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Control Panel Bot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f7f9fc; }
    .container { max-width: 750px; margin-top: 60px; margin-bottom: 60px;}
    h2, h3 { color: #0d6efd; font-weight: 600; }
    .status {
      font-size: 1.4rem;
      font-weight: bold;
    }
  </style>
  <script>
    async function checkStatus() {
      try {
        const res = await fetch("/status");
        const data = await res.json();
        const statusElem = document.getElementById("status");
        statusElem.textContent = data.running ? "🟢 Attivo" : "🔴 Inattivo";
      } catch {
        document.getElementById("status").textContent = "⚠️ Errore connessione";
      }
    }
    setInterval(checkStatus, 3000);
    window.onload = checkStatus;
  </script>
</head>
<body>
  <div class="container bg-white shadow p-4 rounded-4">
    <h2 class="text-center mb-4">Pannello di controllo Bot</h2>

    <!-- Stato bot -->
    <div class="text-center mb-4">
      <div id="status" class="status">⏳ Controllo...</div>
      <div class="mt-3">
        <a href="{{ url_for('run_bot_route') }}" class="btn btn-success btn-lg me-2">▶️ Avvia Bot</a>
        <a href="{{ url_for('stop_bot_route') }}" class="btn btn-danger btn-lg">🛑 Ferma Bot</a>
      </div>
    </div>

    <hr>

    <!-- Form configurazione -->
    <form action="{{ url_for('update_config') }}" method="POST">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Inizio lavoro</label>
          <input type="time" name="work_start" class="form-control" step="1"
                value="{{ config['work_start'] }}">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Fine lavoro</label>
          <input type="time" name="work_end" class="form-control" step="1"
                value="{{ config['work_end'] }}">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Timezone</label>
        <input type="text" name="timezone" class="form-control"
            value="{{ config['timezone'] }}">
      </div>

      <h5 class="mt-4 mb-2 text-secondary">⚡ Intervalli e Boost</h5>
      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label">Boost Duration (sec)</label>
          <input type="number" name="boost_duration" class="form-control"
                value="{{ config['boost_duration'] }}">
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Normal Interval (sec)</label>
          <input type="number" name="normal_interval" class="form-control"
                value="{{ config['normal_interval'] }}">
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Boosted Interval (sec)</label>
          <input type="number" name="boosted_interval" class="form-control"
                value="{{ config['boosted_interval'] }}">
        </div>
      </div>

    <hr>

      <div class="col-md-4 mb-3">
        <label class="form-label">Reset Time (min)</label>
        <input type="number" name="reset_time" class="form-control"
            value="{{ config['reset_time'] }}">
      </div>

      <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" name="bot_paused"
               {% if config['bot_paused'] %}checked{% endif %}>
        <label class="form-check-label">⏸️ Metti in pausa il bot</label>
      </div>

      <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" name="scraping_on"
               {% if config['scraping_on'] %}checked{% endif %}>
        <label class="form-check-label">Attiva scraping</label>
      </div>

      <button type="submit" class="btn btn-primary w-100">💾 Salva modifiche</button>
    </form>

    <div class="text-center mt-4">
      <a href="{{ url_for('dashboard') }}" class="btn btn-outline-primary w-100"> Vai al Database </a>
      <a href="{{ url_for('logs') }}" class="btn btn-outline-primary w-100"> Vai ai Log </a>
    </div>
  </div>
</body>
</html>
